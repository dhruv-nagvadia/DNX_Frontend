<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DNX — AI Life Services Platform</title>
    <script>
      // Applies the saved (or system) theme before first paint, so there's
      // no flash of the wrong theme. Keep the storage key in sync with
      // StorageKeys.theme in src/utils/constants.ts.
      (function () {
        try {
          var saved = localStorage.getItem('dnx.theme');
          var mode =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          // Storage unavailable (private mode, etc.) — theme.css's own
          // prefers-color-scheme fallback still applies.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
